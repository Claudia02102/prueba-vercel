<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba Vercel</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1C1E1B; color: #F3F0E8; font-family: system-ui, sans-serif; }
    main { text-align: center; padding: 24px; }
    h1 { font-size: 40px; margin: 0 0 8px; color: #F4C21B; }
    p { margin: 6px 0; }
    code { background: #2C2F2B; padding: 2px 6px; }
  </style>
</head>
<body>
  <main>
    <h1>¡Funciona!</h1>
    <p>Proyecto de prueba desplegado en Vercel.</p>
    <p>API: <code id="api">consultando…</code></p>
  </main>
  <script>
    fetch('/api/hola').then(r => r.json()).then(d => { document.getElementById('api').textContent = d.mensaje + ' · ' + d.hora; })
      .catch(() => { document.getElementById('api').textContent = 'sin respuesta'; });
  </script>
</body>
</html>
